<!DOCTYPE html>
<html lang="te">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>మా తెలుగు తల్లి - Home</title>
    <style>
        /* --- CONSISTENT STYLING FROM SECOND/THIRD PAGES --- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f9f9f9;
            color: #333;
            line-height: 1.6;
        }

        /* Navigation Bar */
        header {
            background-color: #8b0000; /* Deep Maroon matching cultural theme */
            color: white;
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        header .logo {
            font-size: 1.5rem;
            font-weight: bold;
        }

        nav ul {
            list-style: none;
            display: flex;
            gap: 20px;
        }

        nav ul li a {
            color: white;
            text-decoration: none;
            font-weight: 600;
            transition: color 0.3s;
        }

        nav ul li a:hover, nav ul li a.active {
            color: #ffcc00;
        }

        /* Sections Structure */
        section {
            padding: 4rem 2rem;
            max-width: 1200px;
            margin: 0 auto;
        }

        .section-title {
            text-align: center;
            font-size: 2.2rem;
            color: #8b0000;
            margin-bottom: 2rem;
            position: relative;
        }

        .section-title::after {
            content: '';
            display: block;
            width: 60px;
            height: 4px;
            background-color: #ffcc00;
            margin: 10px auto 0;
            border-radius: 2px;
        }

        /* --- MOVING PICS SLIDER SECTION --- */
        .slider-container {
            position: relative;
            width: 100%;
            max-width: 900px;
            height: 500px;
            margin: 0 auto;
            overflow: hidden;
            border-radius: 12px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.2);
            background: #000;
        }

        .slide {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0;
            transition: opacity 1s ease-in-out;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .slide.active {
            opacity: 1;
        }

        .slide img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .slide-caption {
            position: absolute;
            bottom: 20px;
            background: rgba(0, 0, 0, 0.6);
            color: white;
            padding: 10px 20px;
            border-radius: 4px;
            font-size: 1.2rem;
            text-align: center;
        }

        /* Audio Control Panel */
        .audio-control-box {
            text-align: center;
            margin-top: 20px;
        }

        .btn-play {
            background-color: #8b0000;
            color: white;
            border: none;
            padding: 10px 25px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 5px;
            cursor: pointer;
            transition: background 0.3s;
        }

        .btn-play:hover {
            background-color: #a52a2a;
        }

        /* Founders Section Layout (Consistent with other pages) */
        .founders-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 30px;
            margin-top: 2rem;
        }

        .founder-card {
            background: white;
            padding: 20px;
            border-radius: 8px;
            text-align: center;
            box-shadow: 0 4px 8px rgba(0,0,0,0.05);
            border-top: 4px solid #8b0000;
        }

        .founder-card img {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            object-fit: cover;
            margin-bottom: 15px;
            border: 3px solid #ffcc00;
        }

        .founder-card h3 {
            color: #333;
            margin-bottom: 5px;
        }

        .founder-card p {
            color: #666;
            font-size: 0.95rem;
        }

        /* Footer */
        footer {
            background-color: #333;
            color: white;
            text-align: center;
            padding: 1.5rem;
            margin-top: 3rem;
        }
    </style>
</head>
<body>

    <!-- Header / Navigation (Consistent Format) -->
    <header>
        <div class="logo">మా తెలుగు తల్లి</div>
        <nav>
            <ul>
                <li><a href="#home" class="active">Home</a></li>
                <li><a href="#gallery">Gallery</a></li>
                <li><a href="#founders">Founders</a></li>
                <li><a href="#contact">Contact</a></li>
            </ul>
        </nav>
    </header>

    <!-- Home / Moving Pictures Section -->
    <section id="home">
        <h2 class="section-title">తెలుగు వైభవం</h2>
        
        <!-- Moving Image Slider -->
        <div class="slider-container" id="slider">
            <div class="slide active">
                <img src="https://picsum.photos/id/1018/900/500" alt="Telugu Landscape">
                <div class="slide-caption">అందాల ఆంధ్రప్రదేశ్ / తెలంగాణ</div>
            </div>
            <div class="slide">
                <img src="https://picsum.photos/id/1043/900/500" alt="Culture">
                <div class="slide-caption">సాంస్కృతిక వైభవం</div>
            </div>
            <div class="slide">
                <img src="https://picsum.photos/id/1059/900/500" alt="Heritage">
                <div class="slide-caption">చారిత్రక సంపద</div>
            </div>
        </div>

        <!-- Background Song Player Controls (Ma Telugu Thalliki) -->
        <div class="audio-control-box">
            <!-- Using a reliable open-source audio link for Ma Telugu Thalliki -->
            <audio id="bgSong" loop>
                <source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" type="audio/mpeg">
                Your browser does not support the audio element.
            </audio>
            <button class="btn-play" onclick="toggleAudio()" id="playBtn">🎵 Play Song (మా తెలుగు తల్లి)</button>
        </div>
    </section>

    <!-- Founders Section (Matched Style) -->
    <section id="founders">
        <h2 class="section-title">Our Founders</h2>
        <div class="founders-grid">
            <div class="founder-card">
                <img src="https://picsum.photos/id/1005/150/150" alt="Founder 1">
                <h3>శ్రీ రాములు</h3>
                <p>Chief Visionary & Patron</p>
            </div>
            <div class="founder-card">
                <img src="https://picsum.photos/id/1011/150/150" alt="Founder 2">
                <h3>శ్రీమతి సీత</h3>
                <p>Cultural Lead & Director</p>
            </div>
        </div>
    </section>

    <!-- Footer -->
    <footer>
        <p>&copy; 2026 మా తెలుగు తల్లి. All Rights Reserved.</p>
    </footer>

    <!-- JavaScript for Moving Pictures & Audio -->
    <script>
        // 1. Image Slider Logic (Moving Pics)
        let currentSlide = 0;
        const slides = document.querySelectorAll('.slide');
        
        function nextSlide() {
            slides[currentSlide].classList.remove('active');
            currentSlide = (currentSlide + 1) % slides.length;
            slides[currentSlide].classList.add('active');
        }
        
        // Change slide every 3.5 seconds
        setInterval(nextSlide, 3500);

        // 2. Audio Play/Pause Toggle
        function toggleAudio() {
            const audio = document.getElementById('bgSong');
            const btn = document.getElementById('playBtn');
            
            if (audio.paused) {
                audio.play();
                btn.innerText = "⏸ Pause Song";
            } else {
                audio.pause();
                btn.innerText = "🎵 Play Song (మా తెలుగు తల్లి)";
            }
        }
    </script>
</body>
</html>
